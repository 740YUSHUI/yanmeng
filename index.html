<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌙 验梦提醒器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f35 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 4px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .status-value {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.running {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
        }

        .status-dot.stopped {
            background: #94a3b8;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-row label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            white-space: nowrap;
        }

        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 12px 4px;
            min-width: 0;
        }

        .input-row input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .input-row input[type="number"] {
            -moz-appearance: textfield;
        }

        .input-row .unit {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            padding-right: 14px;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            color: #fff;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-start {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.25);
        }

        .btn-start:active {
            box-shadow: 0 2px 10px rgba(74, 222, 128, 0.15);
        }

        .btn-stop {
            background: linear-gradient(135deg, #f87171, #ef4444);
            box-shadow: 0 4px 20px rgba(248, 113, 113, 0.25);
        }

        .btn-stop:active {
            box-shadow: 0 2px 10px rgba(248, 113, 113, 0.15);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .quick-presets {
            display: flex;
            gap: 8px;
            margin-top: -8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 6px 14px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .preset-btn:active {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(0.95);
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .log-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .log-header span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .log-clear {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .log-clear:active {
            color: rgba(255, 255, 255, 0.6);
        }

        .log-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-list::-webkit-scrollbar {
            width: 3px;
        }

        .log-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .log-item {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-item .time {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .log-empty {
            color: rgba(255, 255, 255, 0.15);
            text-align: center;
            font-size: 14px;
            padding: 20px 0;
        }

        .permission-tip {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: none;
        }

        .permission-tip.show {
            display: block;
        }

        .permission-tip p {
            color: #fbbf24;
            font-size: 13px;
            line-height: 1.5;
        }

        .permission-tip button {
            background: #fbbf24;
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            color: #1a1f35;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            touch-action: manipulation;
        }

        .countdown {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            margin-top: 12px;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 440px) {
            .container {
                padding: 24px 16px;
            }
            h1 {
                font-size: 22px;
            }
            .btn {
                font-size: 16px;
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header">
        <span class="icon">🌙</span>
        <h1>验梦提醒器</h1>
        <div class="subtitle">清醒梦 · 现实检测</div>
    </div>

    <!-- 权限提示 -->
    <div class="permission-tip" id="permissionTip">
        <p>🔔 需要通知权限才能发送提醒</p>
        <button onclick="requestNotificationPermission()">授权通知</button>
    </div>

    <!-- 状态卡片 -->
    <div class="status-card">
        <span class="status-label">状态</span>
        <div class="status-value">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">已停止</span>
        </div>
    </div>

    <!-- 控制区 -->
    <div class="control-group">
        <div class="input-row">
            <label>⏱ 间隔</label>
            <input type="number" id="intervalInput" value="30" min="1" max="999">
            <span class="unit">分钟</span>
        </div>

        <div class="quick-presets">
            <button class="preset-btn" onclick="setIntervalPreset(5)">5分钟</button>
            <button class="preset-btn" onclick="setIntervalPreset(15)">15分钟</button>
            <button class="preset-btn" onclick="setIntervalPreset(30)">30分钟</button>
            <button class="preset-btn" onclick="setIntervalPreset(60)">60分钟</button>
            <button class="preset-btn" onclick="setIntervalPreset(90)">90分钟</button>
        </div>

        <button class="btn btn-start" id="mainBtn" onclick="toggleReminder()">
            ▶️ 启动验梦
        </button>

        <div class="countdown" id="countdownDisplay">下次提醒：--</div>
    </div>

    <!-- 日志 -->
    <div class="log-section">
        <div class="log-header">
            <span>📋 验梦日志</span>
            <button class="log-clear" onclick="clearLogs()">清空</button>
        </div>
        <div class="log-list" id="logList">
            <div class="log-empty">还没有记录</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  核心逻辑
    // ============================================================

    let timer = null;
    let isRunning = false;
    let nextReminderTime = null;
    let countdownInterval = null;
    let logs = [];

    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const mainBtn = document.getElementById('mainBtn');
    const intervalInput = document.getElementById('intervalInput');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const logList = document.getElementById('logList');
    const permissionTip = document.getElementById('permissionTip');

    // —— 检查通知权限（浏览器） ——
    if ('Notification' in window) {
        if (Notification.permission === 'default') {
            permissionTip.classList.add('show');
        } else if (Notification.permission === 'denied') {
            permissionTip.classList.add('show');
            permissionTip.querySelector('p').textContent = '🔕 通知已被拒绝，请在浏览器设置中开启';
            permissionTip.querySelector('button').style.display = 'none';
        }
    }

    window.requestNotificationPermission = function() {
        if ('Notification' in window) {
            Notification.requestPermission().then(perm => {
                if (perm === 'granted') {
                    permissionTip.classList.remove('show');
                } else {
                    permissionTip.querySelector('p').textContent = '🔕 通知被拒绝，部分功能受限';
                }
            });
        }
    };

    // —— 预设间隔 ——
    window.setIntervalPreset = function(minutes) {
        intervalInput.value = minutes;
        if (!isRunning) {
            updateCountdownDisplay(null);
        }
    };

    // —— 切换启动/停止 ——
    window.toggleReminder = function() {
        if (isRunning) {
            stopReminder();
        } else {
            startReminder();
        }
    };

    function startReminder() {
        const minutes = parseInt(intervalInput.value);
        if (isNaN(minutes) || minutes < 1) {
            alert('请输入有效的分钟数（≥1）');
            return;
        }

        if ('Notification' in window && Notification.permission === 'denied') {
            alert('🔕 通知被拒绝，请在浏览器设置中允许通知');
            return;
        }

        isRunning = true;
        updateUI();

        // 立即发送第一次提醒
        sendReminder();

        // 设定定时器
        const intervalMs = minutes * 60 * 1000;
        timer = setInterval(() => {
            sendReminder();
        }, intervalMs);

        // 更新倒计时
        const now = Date.now();
        nextReminderTime = now + intervalMs;
        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);

        mainBtn.textContent = '⏹ 停止验梦';
        mainBtn.className = 'btn btn-stop';
    }

    function stopReminder() {
        isRunning = false;
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        nextReminderTime = null;
        updateUI();
        countdownDisplay.textContent = '下次提醒：--';
        mainBtn.textContent = '▶️ 启动验梦';
        mainBtn.className = 'btn btn-start';
    }

    // —— 发送提醒 ——
    function sendReminder() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });

        // 1. 页面内弹窗提醒
        showDreamAlert(timeStr);

        // 2. 浏览器通知
        if ('Notification' in window && Notification.permission === 'granted') {
            try {
                const notif = new Notification('🌙 验梦时间到！', {
                    body: '捏鼻子、看手指、数手掌纹！此刻是梦是真？',
                    icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ctext y=".9em" font-size="90"%3E🌙%3C/text%3E%3C/svg%3E',
                    tag: 'dreamcheck',
                    requireInteraction: true,
                    silent: false,
                });
                notif.onclick = function() {
                    window.focus();
                    notif.close();
                };
                setTimeout(() => notif.close(), 15000);
            } catch (e) {
                // 静默失败
            }
        }

        // 3. 震动（移动端）
        if (navigator.vibrate) {
            navigator.vibrate([300, 100, 300, 100, 300]);
        }

        // 4. 声音提醒（Web Audio）
        try {
            playBeep();
        } catch (e) { /* 静默 */ }

        // 5. 记录日志
        addLog(timeStr);
    }

    // —— 页面内弹窗 ——
    function showDreamAlert(timeStr) {
        // 移除旧弹窗
        const old = document.querySelector('.dream-overlay');
        if (old) old.remove();

        const overlay = document.createElement('div');
        overlay.className = 'dream-overlay';
        overlay.style.cssText = `
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
            padding: 32px;
        `;

        // 注入关键帧动画（如果还没有）
        if (!document.getElementById('dreamStyles')) {
            const style = document.createElement('style');
            style.id = 'dreamStyles';
            style.textContent = `
                @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
                @keyframes popIn { 0% { transform:scale(0.8); opacity:0; } 100% { transform:scale(1); opacity:1; } }
            `;
            document.head.appendChild(style);
        }

        overlay.innerHTML = `
            <div style="background:linear-gradient(145deg,#1a1f35,#0b0e1a);border-radius:32px;padding:40px 32px;max-width:360px;width:100%;text-align:center;border:1px solid rgba(255,255,255,0.1);animation:popIn 0.4s ease;">
                <div style="font-size:64px;margin-bottom:12px;">🌙</div>
                <h2 style="color:#fff;font-size:24px;margin-bottom:8px;">验梦时间！</h2>
                <p style="color:rgba(255,255,255,0.6);font-size:16px;line-height:1.6;margin-bottom:6px;">
                    👃 捏鼻子<br>
                    ✋ 看手指<br>
                    🖐 数手掌纹
                </p>
                <p style="color:rgba(255,255,255,0.3);font-size:13px;margin-top:12px;">
                    ${timeStr} · 保持清醒
                </p>
                <button onclick="this.closest('.dream-overlay').remove()" style="
                    margin-top:20px;
                    background:rgba(255,255,255,0.1);
                    border:1px solid rgba(255,255,255,0.15);
                    border-radius:12px;
                    padding:12px 32px;
                    color:#fff;
                    font-size:16px;
                    font-weight:600;
                    cursor:pointer;
                    touch-action:manipulation;
                ">我知道了</button>
            </div>
        `;

        document.body.appendChild(overlay);

        // 5秒后自动关闭
        setTimeout(() => {
            if (overlay.parentNode) overlay.remove();
        }, 8000);
    }

    // —— 声音 ——
    function playBeep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.5);

        // 第二次蜂鸣
        setTimeout(() => {
            const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
            const osc2 = ctx2.createOscillator();
            const gain2 = ctx2.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx2.destination);
            osc2.frequency.value = 1100;
            osc2.type = 'sine';
            gain2.gain.setValueAtTime(0.25, ctx2.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, ctx2.currentTime + 0.3);
            osc2.start(ctx2.currentTime);
            osc2.stop(ctx2.currentTime + 0.3);
        }, 200);
    }

    // —— 日志 ——
    function addLog(timeStr) {
        logs.push({ time: timeStr, timestamp: Date.now() });
        if (logs.length > 50) logs.shift();
        renderLogs();
    }

    function renderLogs() {
        if (logs.length === 0) {
            logList.innerHTML = '<div class="log-empty">还没有记录</div>';
            return;
        }
        logList.innerHTML = logs.slice().reverse().map(log =>
            `<div class="log-item">
                <span>🌙 验梦提醒</span>
                <span class="time">${log.time}</span>
            </div>`
        ).join('');
    }

    window.clearLogs = function() {
        logs = [];
        renderLogs();
    };

    // —— 倒计时 ——
    function updateCountdown() {
        if (!nextReminderTime) {
            countdownDisplay.textContent = '下次提醒：--';
            return;
        }
        const diff = Math.max(0, nextReminderTime - Date.now());
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        countdownDisplay.textContent = `下次提醒：${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        if (diff <= 0) {
            countdownDisplay.textContent = '⏰ 即将提醒...';
        }
    }

    function updateCountdownDisplay(time) {
        if (time) {
            nextReminderTime = time;
            updateCountdown();
        } else {
            countdownDisplay.textContent = '下次提醒：--';
        }
    }

    // —— UI 更新 ——
    function updateUI() {
        if (isRunning) {
            statusText.textContent = '运行中';
            statusDot.className = 'status-dot running';
        } else {
            statusText.textContent = '已停止';
            statusDot.className = 'status-dot stopped';
        }
    }

    // —— 初始化 ——
    updateUI();
    renderLogs();

    // 页面关闭时清理定时器
    window.addEventListener('beforeunload', function() {
        if (timer) clearInterval(timer);
        if (countdownInterval) clearInterval(countdownInterval);
    });

    console.log('🌙 验梦提醒器已加载');
    console.log('💡 设置间隔后点击"启动验梦"即可');
</script>

</body>
</html>
